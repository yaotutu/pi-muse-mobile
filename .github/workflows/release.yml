name: release

# push 到 main 时，prepare 产生唯一 bump 提交；两个平台都从该 SHA 构建。
# workflow_dispatch 只做同一 SHA 的双平台构建验收，不 bump、push 或发布。
# 正式 release job 必须等待 APK 与未签名 IPA 都存在，才能创建 GitHub Release。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release-source.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        if: github.event_name == 'push'

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
        if: github.event_name == 'push'

      - name: Install
        run: npm ci
        if: github.event_name == 'push'

      - name: Bump version
        id: bump
        run: node tools/bump-version.js >> "$GITHUB_OUTPUT"
        if: github.event_name == 'push'

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          if git diff --staged --quiet; then
            echo "No version bump needed"
            exit 0
          fi
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Resolve build source
        id: release-source
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/android-signing.js

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android release APK
        run: cd android && ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      # 使用 generic iOS device destination：只做真机 Release 产物，不要求连接设备。
      # pod install 生成的 workspace 必须存在；它携带 Pods target 与链接依赖。
      - name: Build unsigned iOS app
        run: |
          test -f ios/PiMuse.xcworkspace/contents.xcworkspacedata
          xcodebuild \
            -workspace ios/PiMuse.xcworkspace \
            -scheme PiMuse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: >
          node tools/package-ios-unsigned.mjs
          --app build/Build/Products/Release-iphoneos/PiMuse.app
          --output dist/app-release-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned-ipa
          path: dist/app-release-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [prepare, android, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-downloads/android

      - uses: actions/download-artifact@v4
        with:
          name: ios-release-unsigned-ipa
          path: release-downloads/ios

      - name: Require complete release assets
        run: |
          test -f release-downloads/android/app-release.apk
          test -f release-downloads/ios/app-release-unsigned.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true
          body: |
            ## Release assets

            - `app-release.apk` is the signed Android installation package. The in-app Android updater only downloads this stable APK asset.
            - `app-release-unsigned.ipa` is not directly installable. It is not an App Store or TestFlight build; a user with valid iOS signing credentials and a provisioning profile must re-sign it before installation.

            ## 发布产物说明

            - `app-release.apk` 是已签名的 Android 安装包。Android 应用内更新只会下载这个稳定 APK asset。
            - `app-release-unsigned.ipa` 不能直接安装，也不是 App Store 或 TestFlight 构建；必须由拥有有效 iOS 证书与描述文件的用户先重签，再安装。
          files: |
            release-downloads/android/app-release.apk
            release-downloads/ios/app-release-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
